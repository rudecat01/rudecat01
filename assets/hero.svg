<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Dhruv Chaudhary. Full-Stack AI and Autonomous Systems Engineer.">
<title>Dhruv Chaudhary</title>
<style>
  .pulse-line { animation: pulseFlow 4s linear infinite; }
  .p0 { animation-delay: 0s; }
  .p1 { animation-delay: 0.6s; }
  .p2 { animation-delay: 1.2s; }
  .p3 { animation-delay: 1.8s; }
  .p4 { animation-delay: 2.4s; }
  .p5 { animation-delay: 3.0s; }
  @keyframes pulseFlow {
    0% { stroke-dashoffset: var(--len); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }
  .sup-pulse {
    animation: supRing 2.4s ease-out infinite;
  }
  @keyframes supRing {
    0% { r: 24; opacity: 0.9; }
    100% { r: 52; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse-line { animation: none; stroke-dashoffset: 0; opacity: 0.6; }
    .sup-pulse { animation: none; opacity: 0; }
  }
</style>
<defs>
  <linearGradient id="fade" x1="0" x2="1">
    <stop offset="0" stop-color="#0F1E33" stop-opacity="1"/>
    <stop offset=".44" stop-color="#0F1E33" stop-opacity="1"/>
    <stop offset=".66" stop-color="#0F1E33" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="supGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3FD0C9"/>
    <stop offset="100%" stop-color="#8B9CFF"/>
  </linearGradient>
</defs>

