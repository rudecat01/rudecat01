<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Linear Accent Gradient -->
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    /* Cursor Blink */
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: cursorBlink 1s infinite;
    }

    /* Radar Pulse */
    @keyframes radarPulse {
      0% { r: 10; opacity: 0.9; }
      100% { r: 68; opacity: 0; }
    }
    .pulse-ring {
      animation: radarPulse 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    .pulse-ring-2 {
      animation: radarPulse 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      animation-delay: 1.5s;
    }

    /* Subtle Rotating Grid Node */
    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .rotating-group {
      transform-origin: 720px 130px;
      animation: slowSpin 24s linear infinite;
    }

    /* Status Dot Glow */
    @keyframes glowDot {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 2px #10b981); }
      50% { opacity: 0.5; filter: drop-shadow(0 0 0px #10b981); }
    }
    .live-dot {
      animation: glowDot 2s ease-in-out infinite;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="848" height="258" rx="10" fill="url(#bg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Window Header Bar -->
  <path d="M1 11 C1 5.477 5.477 1 11 1 L839 1 C844.523 1 849 5.477 849 11 L849 34 L1 34 Z" fill="#0d1527" stroke="#1e293b" stroke-width="1" />
  
  <!-- Terminal Controls -->
  <circle cx="20" cy="17.5" r="5" fill="#ef4444" fill-opacity="0.85" />
  <circle cx="36" cy="17.5" r="5" fill="#f59e0b" fill-opacity="0.85" />
  <circle cx="52" cy="17.5" r="5" fill="#10b981" fill-opacity="0.85" />

  <!-- Window Title -->
  <text x="425" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#64748b" text-anchor="middle">rudecat01@workstation: ~ (zsh)</text>

  <!-- Top Accent Highlight -->
  <rect x="1" y="1" width="848" height="2" rx="1" fill="url(#cyanIndigo)" />

  <!-- ================= LEFT: TERMINAL INTERACTION ================= -->
  <!-- Prompt 1 -->
  <g transform="translate(32, 60)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#38bdf8">❯</text>
    <text x="16" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#f8fafc">whoami</text>
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Dhruv Chaudhary</text>
    <text x="220" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">(@rudecat01)</text>
  </g>

  <!-- Prompt 2 -->
  <g transform="translate(32, 114)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#38bdf8">❯</text>
    <text x="16" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#f8fafc">cat focus.md</text>
    
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#cbd5e1">
      <tspan fill="#818cf8" font-weight="600">Software &amp; AI Engineer</tspan> &bull; Autonomous Multi-Agent Systems &amp; Production Backends
    </text>
    <text x="16" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">
      Building deterministic tools around non-deterministic AI (Supervisor loops &bull; Judge0 sandboxing &bull; XGBoost).
    </text>
  </g>

  <!-- Prompt 3: Running Status / Live System -->
  <g transform="translate(32, 192)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#38bdf8">❯</text>
    <text x="16" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#f8fafc">system.status</text>
    
    <!-- Status Box -->
    <rect x="16" y="12" width="460" height="32" rx="6" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
    <circle cx="32" cy="28" r="4.5" fill="#10b981" class="live-dot" />
    <text x="46" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e2e8f0">
      active_pipeline: <tspan fill="#38bdf8">Placement Mentor (MVP)</tspan> &bull; open_to_roles: <tspan fill="#10b981">true</tspan>
    </text>
    <rect x="444" y="22" width="7" height="13" fill="#38bdf8" class="cursor" />
  </g>

  <!-- ================= RIGHT: HIGH-TECH RADAR / ARCHITECTURE ANIMATION ================= -->
  <!-- Center: 720, 145 -->
  <g transform="translate(0, 15)">
    <!-- Concentric Target Circles -->
    <circle cx="720" cy="130" r="28" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="720" cy="130" r="52" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="720" cy="130" r="76" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6" />

    <!-- Crosshair Axis -->
    <line x1="620" y1="130" x2="820" y2="130" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="720" y1="30" x2="720" y2="230" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 4" />

    <!-- Animated Radar Pulse Rings -->
    <circle cx="720" cy="130" r="12" fill="none" stroke="#38bdf8" stroke-width="1.8" class="pulse-ring" />
    <circle cx="720" cy="130" r="12" fill="none" stroke="#818cf8" stroke-width="1.8" class="pulse-ring-2" />

    <!-- Rotating Constellation / Multi-Agent Nodes -->
    <g class="rotating-group">
      <!-- Node 1: Top (FastAPI/Backend) -->
      <line x1="720" y1="130" x2="720" y2="78" stroke="#334155" stroke-width="1.2" />
      <circle cx="720" cy="78" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle cx="720" cy="78" r="2" fill="#38bdf8" />

      <!-- Node 2: Bottom-Right (Next.js/Frontend) -->
      <line x1="720" y1="130" x2="765" y2="156" stroke="#334155" stroke-width="1.2" />
      <circle cx="765" cy="156" r="6" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <circle cx="765" cy="156" r="2" fill="#818cf8" />

      <!-- Node 3: Bottom-Left (ML/XGBoost) -->
      <line x1="720" y1="130" x2="675" y2="156" stroke="#334155" stroke-width="1.2" />
      <circle cx="675" cy="156" r="6" fill="#0f172a" stroke="#c084fc" stroke-width="2" />
      <circle cx="675" cy="156" r="2" fill="#c084fc" />
    </g>

    <!-- Center Core Node (Supervisor Agent) -->
    <circle cx="720" cy="130" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="720" cy="130" r="3.5" fill="#38bdf8" />

    <!-- Label Underneath Radar -->
    <text x="720" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#475569" text-anchor="middle" letter-spacing="1">AGENT_GRAPH // LIVE</text>
  </g>
</svg>
