<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="850" height="140" fill="none">
  <!-- Clean Dark Background matching GitHub dark theme -->
  <rect x="1" y="1" width="848" height="138" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1" />
  
  <!-- Subtle top accent line: minimalist slate/blue -->
  <line x1="8" y1="1" x2="842" y2="1" stroke="#30363d" stroke-width="1" />

  <!-- Breadcrumb / Domain -->
  <g transform="translate(36, 32)">
    <circle cx="4" cy="4" r="3" fill="#3fb950" />
    <text x="16" y="7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#8b949e" letter-spacing="0.5">rudecat01 / engineer</text>
  </g>

  <!-- Name -->
  <text x="36" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f0f6fc" letter-spacing="-0.4">Dhruv Chaudhary</text>

  <!-- Professional Subline -->
  <text x="36" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">
    Software &amp; AI Engineer &bull; Autonomous Multi-Agent Architectures &bull; High-Throughput Backends
  </text>

  <!-- Minimalist Right Accent: Clean Monospaced Code Snippet / Terminal Pill -->
  <g transform="translate(640, 38)">
    <rect width="170" height="64" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#7ee787">$ system.status</text>
    <text x="16" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#58a6ff">&gt; ready_for_roles</text>
  </g>
</svg>
