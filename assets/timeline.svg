<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="850" height="160" fill="none">
  <defs>
    <!-- Muted Circuit Track Gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Node Glow Filter (Restrained) -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseNode {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }
    .active-dot {
      animation: pulseNode 2.5s ease-in-out infinite;
      transform-origin: 775px 75px;
    }
  </style>

  <!-- Container Box matching Workstation Theme -->
  <rect x="1" y="1" width="848" height="158" rx="8" fill="#0a0e17" stroke="#1e293b" stroke-width="1.2" />

  <!-- Subtle Top Accent Header -->
  <rect x="1" y="1" width="848" height="2" rx="1" fill="#1e293b" />

  <!-- Top Header Bar -->
  <g transform="translate(24, 22)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="1">// TRACK_RECORD &amp; MILESTONES</text>
  </g>
  <g transform="translate(710, 14)">
    <rect width="115" height="20" rx="4" fill="#0d1527" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="10" cy="10" r="3" fill="#10b981" />
    <text x="18" y="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#94a3b8">VERIFIED TRACE</text>
  </g>

  <!-- Main Circuit / Timeline Track -->
  <line x1="75" y1="75" x2="775" y2="75" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <line x1="75" y1="75" x2="775" y2="75" stroke="url(#trackGrad)" stroke-width="1.5" stroke-linecap="round" />

  <!-- ================= STATION 1: 10th ================= -->
  <g transform="translate(75, 0)">
    <!-- Node -->
    <circle cx="0" cy="75" r="5.5" fill="#0a0e17" stroke="#64748b" stroke-width="2" />
    <circle cx="0" cy="75" r="2" fill="#64748b" />
    <!-- Top: Stage & Label -->
    <text x="0" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#64748b" text-anchor="middle">ACADEMIC</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Class 10th</text>
    <!-- Bottom: Metric & Sub -->
    <text x="0" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">97.4%</text>
    <text x="0" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Secondary Board</text>
  </g>

  <!-- ================= STATION 2: 12th ================= -->
  <g transform="translate(215, 0)">
    <!-- Node -->
    <circle cx="0" cy="75" r="5.5" fill="#0a0e17" stroke="#64748b" stroke-width="2" />
    <circle cx="0" cy="75" r="2" fill="#64748b" />
    <!-- Top: Stage & Label -->
    <text x="0" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#64748b" text-anchor="middle">ACADEMIC</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Class 12th</text>
    <!-- Bottom: Metric & Sub -->
    <text x="0" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">95.2%</text>
    <text x="0" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Senior Secondary</text>
  </g>

  <!-- ================= STATION 3: JEE Mains ================= -->
  <g transform="translate(355, 0)">
    <!-- Node -->
    <circle cx="0" cy="75" r="6" fill="#0a0e17" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="75" r="2.5" fill="#38bdf8" />
    <!-- Top: Stage & Label -->
    <text x="0" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#38bdf8" text-anchor="middle">NATIONAL</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">JEE Mains</text>
    <!-- Bottom: Metric & Sub -->
    <text x="0" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="700" fill="#38bdf8" text-anchor="middle">99.12 %ile</text>
    <text x="0" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Top 1% Nationwide</text>
  </g>

  <!-- ================= STATION 4: Innerve 9.0 ================= -->
  <g transform="translate(495, 0)">
    <!-- Node -->
    <circle cx="0" cy="75" r="6" fill="#0a0e17" stroke="#818cf8" stroke-width="2" />
    <circle cx="0" cy="75" r="2.5" fill="#818cf8" />
    <!-- Top: Stage & Label -->
    <text x="0" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#818cf8" text-anchor="middle">HACKATHON</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Innerve 9.0</text>
    <!-- Bottom: Metric & Sub -->
    <text x="0" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="700" fill="#818cf8" text-anchor="middle">Top 31</text>
    <text x="0" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">2,500+ Teams</text>
  </g>

  <!-- ================= STATION 5: Gemini 3 Hackathon ================= -->
  <g transform="translate(635, 0)">
    <!-- Node -->
    <circle cx="0" cy="75" r="6" fill="#0a0e17" stroke="#c084fc" stroke-width="2" />
    <circle cx="0" cy="75" r="2.5" fill="#c084fc" />
    <!-- Top: Stage & Label -->
    <text x="0" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#c084fc" text-anchor="middle">GLOBAL AI</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Gemini 3 Hack</text>
    <!-- Bottom: Metric & Sub -->
    <text x="0" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="700" fill="#c084fc" text-anchor="middle">Top 100</text>
    <text x="0" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">35,000+ Participants</text>
  </g>

  <!-- ================= STATION 6: DoT 5G Cybersec ================= -->
  <g transform="translate(775, 0)">
    <!-- Node -->
    <circle cx="0" cy="75" r="7" fill="#0a0e17" stroke="#10b981" stroke-width="2" />
    <circle cx="0" cy="75" r="3" fill="#10b981" class="active-dot" />
    <!-- Top: Stage & Label -->
    <text x="0" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" fill="#10b981" text-anchor="middle">GOVT OF INDIA</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">DoT (Telecom)</text>
    <!-- Bottom: Metric & Sub -->
    <text x="0" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700" fill="#10b981" text-anchor="middle">5G Cybersec</text>
    <text x="0" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Research Intern</text>
  </g>
</svg>
